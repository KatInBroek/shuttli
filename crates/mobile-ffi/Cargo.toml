[package]
name = "shuttli-mobile-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.shuttli]
layer = "mobile-ffi"

[lib]
name = "shuttli_mobile_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[lints]
workspace = true

[dependencies]
shuttli-content.workspace = true
shuttli-mobile-sdk.workspace = true
shuttli-model.workspace = true
hex.workspace = true
sha2.workspace = true
uniffi = "=0.31.2"
