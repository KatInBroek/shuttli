[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/KatInBroek/shuttli"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.dependencies]
shuttli-brand = { path = "crates/brand" }
shuttli-model = { path = "crates/model" }
shuttli-core = { path = "crates/core" }
shuttli-api = { path = "crates/api" }
shuttli-ports = { path = "crates/ports" }
shuttli-application = { path = "crates/application" }
shuttli-adapters = { path = "crates/adapters" }
shuttli-runtime = { path = "crates/runtime" }
shuttli-cli = { path = "crates/cli" }
shuttli-host = { path = "crates/host" }
shuttli-contract-tests = { path = "crates/contract-tests" }
shuttli-mobile-sdk = { path = "crates/mobile-sdk" }
shuttli-mobile-ffi = { path = "crates/mobile-ffi" }
shuttli-protocol = { path = "crates/protocol" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
png = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
zeroize = "1"
fs2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
x509-parser = "0.17"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x11rb = { version = "0.13", features = ["xfixes"] }
base64 = "0.22"
shuttli-native-ui = { path = "crates/native-ui" }
rustix = { version = "1", features = ["event"] }
